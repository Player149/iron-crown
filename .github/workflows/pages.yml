name: Godot Web → Project Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_SILENCE_ROOT_WARNING: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Verify combat, progression and boss restoration
        run: timeout 15s godot --headless --path . res://tests/run.tscn
      - name: Verify portrait and landscape layouts
        run: timeout 15s godot --headless --path . res://tests/layout.tscn
      - name: Verify moving attacks preserve world position
        run: timeout 15s godot --headless --path . res://tests/playback.tscn
      - name: Export Web
        run: |
          mkdir -p build/web
          # Version every engine and game asset together; keep the same URL directory for saves.
          stem="play-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-release Web "build/web/$stem.html"
          cp "build/web/$stem.html" build/web/index.html
          cp "build/web/$stem.html" build/web/play.html
          printf '%s\n' "$GITHUB_SHA" > build/web/build-id.txt
          # Replace the previously registered PWA worker without touching save storage.
          cat > build/web/index.service.worker.js <<'JS'
          self.addEventListener("install", event => event.waitUntil(self.skipWaiting()));
          self.addEventListener("activate", event => event.waitUntil(self.registration.unregister()));
          JS
          touch build/web/.nojekyll
      - name: Verify exported web game starts from menu in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --directory build/web >/tmp/iron-web.log 2>&1 &
          python - <<'PY'
          import re, os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--enable-webgl", "--use-gl=angle", "--use-angle=swiftshader", "--enable-unsafe-swiftshader"])
              page = browser.new_page(viewport={"width": 1152, "height": 648})
              logs = []
              page.on("console", lambda msg: (logs.append(msg.text), print(msg.text, flush=True)))
              page.on("pageerror", lambda err: print(err, flush=True))
              with page.expect_event("console", predicate=lambda msg: "IRON_CROWN_MENU_READY " in msg.text, timeout=90000) as ready:
                  page.goto("http://127.0.0.1:8765/play-" + os.environ["GITHUB_SHA"][:12] + ".html", wait_until="domcontentloaded")
              match = re.search(r"IRON_CROWN_MENU_READY ([0-9.]+) ([0-9.]+)", ready.value.text)
              assert match, ready.value.text
              canvas = page.locator("canvas").first
              rect = canvas.bounding_box()
              assert rect, "Game canvas missing"
              x, y = map(float, match.groups())
              with page.expect_event("console", predicate=lambda msg: "IRON_CROWN_GAME_STARTED play" in msg.text, timeout=30000):
                  page.mouse.click(rect["x"] + x * rect["width"], rect["y"] + y * rect["height"])
              page.wait_for_timeout(2000)
              assert not any("SCRIPT ERROR" in line or "Parse Error" in line for line in logs), logs
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iron-crown-web
          path: build/web
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish project site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published build version and entry URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 20); do
            actual=$(curl -fsSL "$base/build-id.txt?rev=$GITHUB_SHA" || true)
            if [ "$actual" = "$GITHUB_SHA" ]; then
              curl -fsSL "$base/play-${GITHUB_SHA:0:12}.html" | grep -F "play-${GITHUB_SHA:0:12}.js" >/dev/null
              echo "Published version verified: $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Published version not visible" >&2
          exit 1
